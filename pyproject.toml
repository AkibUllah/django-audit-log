[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "django-audit-log"
version = "0.1.0"
description = "Reusable Django app for audit trails: field-level diffs on create/update/delete, sensitive-field masking, request context (actor, IP, request id) via middleware, admin and optional DRF integration."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
requires-python = ">=3.10"
keywords = ["django", "audit", "audit-log", "audit-trail", "history", "changelog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]
dev = [
    "djangorestframework>=3.14",
    "whitenoise>=6.6",
    "pytest>=7.4",
    "pytest-django>=4.14.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/AkibUllah/django-audit-log"
Issues = "https://github.com/AkibUllah/django-audit-log/issues"

[tool.hatch.build.targets.wheel]
packages = ["audit_log"]

[tool.hatch.build.targets.sdist]
include = ["audit_log", "tests", "example", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["B904", "DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["audit_log", "tests", "example"]
