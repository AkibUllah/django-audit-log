services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audit_example
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_example"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: compose-example-secret-key-not-for-production-0123456789
      DJANGO_DEBUG: "true"
      # Override from the shell when running behind a forwarding proxy (e.g. Codespaces).
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SEED_DEMO: ${DJANGO_SEED_DEMO:-true}
      DJANGO_DB: postgres
      POSTGRES_DB: audit_example
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_HOST: db
    ports:
      - "8000:8000"

volumes:
  pgdata:
