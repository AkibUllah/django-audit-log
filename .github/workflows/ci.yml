name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        django: ["4.2", "5.0"]
    name: py${{ matrix.python-version }} / Django ${{ matrix.django }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "Django~=${{ matrix.django }}.0"
          python -c "import django; print(django.get_version())"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: DJANGO_SETTINGS_MODULE=tests.settings python -m django makemigrations --check --dry-run
      - name: Test
        run: pytest -q --cov=audit_log --cov-report=term-missing

  postgres:
    runs-on: ubuntu-latest
    name: py3.11 / PostgreSQL 16
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit_log
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DB: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "psycopg[binary]>=3.1"
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
