name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        django: ["4.2", "5.0"]
    name: py${{ matrix.python-version }} / Django ${{ matrix.django }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "Django~=${{ matrix.django }}.0"
          python -c "import django; print(django.get_version())"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: DJANGO_SETTINGS_MODULE=tests.settings python -m django makemigrations --check --dry-run
      - name: Test
        run: pytest -q --cov=audit_log --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
